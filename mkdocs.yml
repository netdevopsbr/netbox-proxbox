site_name: Proxbox Docs
site_dir: ./site
site_url: https://emersonfelipesp.github.io/netbox-proxbox/
docs_dir: ./docs
repo_name: emersonfelipesp/netbox-proxbox
repo_url: https://github.com/emersonfelipesp/netbox-proxbox
theme:
  name: material
  custom_dir: docs/_theme/
  icon:
    repo: fontawesome/brands/github
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep-orange
      toggle:
        icon: material/lightbulb-outline
        name: Switch to Dark Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/lightbulb
        name: Switch to Light Mode
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - navigation.footer
    - navigation.path
    - navigation.top
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            extensions:
              - griffe_typingdoc
            show_bases: true
            #show_root_heading: true
            show_if_no_docstring: true
            inherited_members: true
            #members_order: source
            #separate_signature: true
            #unwrap_annotated: true
            #merge_init_into_class: true
            #docstring_section_style: spacy
            #signature_crossrefs: true
hooks:
  - docs/hooks.py

