name: Gitea Package Registry — Publish

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to publish (e.g. v0.0.16rc1 or v0.0.16)'
        required: true
      resume_existing:
        description: 'Resume after an interrupted publish only when the registry bytes exactly match the rebuilt manifest'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-publication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-version:
    if: ${{ github.repository == 'emersonfelipesp/netbox-proxbox' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      is_rc: ${{ steps.extract.outputs.is_rc }}
      tag: ${{ steps.extract.outputs.tag }}
      tag_object: ${{ steps.extract.outputs.tag_object }}
      source_sha: ${{ steps.extract.outputs.source_sha }}
      resume_existing: ${{ steps.resolve_tag.outputs.resume_existing }}
    steps:
      - name: Determine tag
        id: resolve_tag
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_RESUME_EXISTING: ${{ inputs.resume_existing }}
        run: |
          set -euo pipefail
          TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+|\.post[0-9]+)?$'
          TAG="$INPUT_TAG"
          if ! echo "${TAG}" | grep -qE "${TAG_PATTERN}"; then
            echo "ERROR: tag '${TAG}' does not match expected pattern ${TAG_PATTERN}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_ENV"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          RESUME_EXISTING=false
          if [ "$INPUT_RESUME_EXISTING" = "true" ]; then
            RESUME_EXISTING=true
          fi
          echo "resume_existing=${RESUME_EXISTING}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.resolve_tag.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - id: extract
        name: Extract and validate version
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          TAG_OBJECT="$(git rev-parse "refs/tags/${TAG}")"
          SOURCE_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          echo "tag_object=${TAG_OBJECT}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          if echo "${VERSION}" | grep -qE 'rc[0-9]+$'; then
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
            echo "RC release: ${VERSION}"
          else
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
            echo "Official release: ${VERSION}"
          fi
          # Validate pyproject.toml matches tag
          PYVER=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "${VERSION}" != "${PYVER}" ]; then
            echo "ERROR: tag ${TAG} (${VERSION}) does not match pyproject.toml version ${PYVER}"
            exit 1
          fi
          echo "Version ${VERSION} validated against pyproject.toml"
          # Validate __init__.py version matches
          if [ -f "netbox_proxbox/__init__.py" ]; then
            INITVER=$(grep 'version = ' netbox_proxbox/__init__.py | grep -v '#' | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [ "${VERSION}" != "${INITVER}" ]; then
              echo "ERROR: tag ${TAG} (${VERSION}) does not match __init__.py version ${INITVER}"
              exit 1
            fi
            echo "Version ${VERSION} validated against __init__.py"
          fi


  publish-gitea:
    needs: validate-version
    if: ${{ github.repository == 'emersonfelipesp/netbox-proxbox' && github.ref == 'refs/heads/main' && needs.validate-version.outputs.version != '' }}
    runs-on: mirror-host
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
      TAG: ${{ needs.validate-version.outputs.tag }}
      EXPECTED_TAG_OBJECT: ${{ needs.validate-version.outputs.tag_object }}
      EXPECTED_SOURCE_SHA: ${{ needs.validate-version.outputs.source_sha }}
      IS_RC: ${{ needs.validate-version.outputs.is_rc }}
      RESUME_EXISTING: ${{ needs.validate-version.outputs.resume_existing }}
    steps:
      - name: Checkout canonical publisher control
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout candidate tag as passive build input
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-version.outputs.source_sha }}
          path: candidate
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Bind candidate tag to validated objects
        run: |
          set -euo pipefail
          git -C candidate fetch --force --no-tags origin \
            "+refs/tags/${TAG}:refs/release-policy/candidate-tag"
          test "$(git -C candidate rev-parse refs/release-policy/candidate-tag)" = \
            "${EXPECTED_TAG_OBJECT}"
          test "$(git -C candidate rev-parse refs/release-policy/candidate-tag^{commit})" = \
            "${EXPECTED_SOURCE_SHA}"
          test "$(git -C candidate rev-parse HEAD^{commit})" = \
            "${EXPECTED_SOURCE_SHA}"

      - name: Verify pre-provisioned build tools
        env:
          PYTHON_VERSION: "3.12.14"
          UV_VERSION: "0.12.5"
        run: |
          set -euo pipefail
          # Release jobs install no executable tooling. The accepted runner
          # image must already provide the exact reviewed uv version; otherwise
          # this fails before candidate code is built or a credential is used.
          for tool in python3 uv; do
            command -v "${tool}" >/dev/null 2>&1 || {
              echo "ERROR: pre-provisioned ${tool} is required"
              exit 1
            }
          done
          ACTUAL_PYTHON="$(python3 --version 2>&1)"
          if [ "${ACTUAL_PYTHON}" != "Python ${PYTHON_VERSION}" ]; then
            echo "ERROR: expected 'Python ${PYTHON_VERSION}', got '${ACTUAL_PYTHON}'"
            exit 1
          fi
          ACTUAL_UV="$(uv --version)"
          if [ "${ACTUAL_UV}" != "uv ${UV_VERSION}" ]; then
            echo "ERROR: expected 'uv ${UV_VERSION}', got '${ACTUAL_UV}'"
            exit 1
          fi
          printf '%s\n' "${ACTUAL_PYTHON}"
          printf '%s\n' "${ACTUAL_UV}"

      - name: Build distributions
        run: |
          set -euo pipefail
          # Build and upload from the repository's own locked `publish` group
          # rather than resolving a backend and an ephemeral twine at run time.
          # `uv.lock` carries hashes for that group, so the PEP 517 backend and
          # the credential-bearing uploader are the reviewed, pinned ones
          # (hatchling 1.31.0, twine 6.2.0) instead of whatever resolution
          # happens to pick on the day.
          uv sync --python "$(command -v python3)" --no-python-downloads \
            --only-group publish --locked --no-install-project
          ACTUAL_HATCHLING="$(.venv/bin/python -c \
            'from importlib.metadata import version; print(version("hatchling"))')"
          test "${ACTUAL_HATCHLING}" = "1.31.0" || {
            echo "ERROR: expected hatchling 1.31.0, got ${ACTUAL_HATCHLING}"
            exit 1
          }
          test "$(.venv/bin/python --version 2>&1)" = "Python 3.12.14"
          python3 scripts/release_artifacts.py sanitize-build-source \
            --source candidate --destination sanitized-candidate \
            --package netbox-proxbox --version "${VERSION}"
          uv build --no-build-isolation --python .venv/bin/python \
            --out-dir dist sanitized-candidate
          ls dist/

      - name: Build release manifest
        run: |
          set -euo pipefail
          # Bind the artifacts to the tagged commit before either is uploaded.
          # `fetch-gitea` -- the deploy and promotion consumer -- compares the
          # manifest's `source_sha` against the tag it was asked to deploy, so
          # the value must be the commit the tag resolves to, not the tag
          # object's own SHA. `^{commit}` peels an annotated tag; a lightweight
          # tag already points at the commit and is unaffected.
          SOURCE_SHA="${EXPECTED_SOURCE_SHA}"
          PKG_NAME=netbox-proxbox
          python3 scripts/release_artifacts.py manifest \
            --dist dist \
            --package "${PKG_NAME}" \
            --version "${VERSION}" \
            --source-sha "${SOURCE_SHA}" \
            --manifest release-manifest.json
          echo "Release manifest built for ${PKG_NAME} ${VERSION} at ${SOURCE_SHA}"

      - name: Recreate fixed publisher environment
        run: |
          set -euo pipefail
          # Candidate bytes are now passive files in dist/. Recreate every
          # executable that will later receive a credential from canonical
          # control metadata, then prove candidate processing did not modify
          # the reviewed helper or lock inputs.
          rm -rf -- .venv
          uv sync --python "$(command -v python3)" --no-python-downloads \
            --only-group publish --locked --no-install-project
          test "$(.venv/bin/python --version 2>&1)" = "Python 3.12.14"
          test "$(.venv/bin/python -c \
            'from importlib.metadata import version; print(version("hatchling"))')" = \
            "1.31.0"
          test "$(.venv/bin/python -c \
            'from importlib.metadata import version; print(version("twine"))')" = \
            "6.2.0"
          git diff --exit-code -- scripts/release_artifacts.py pyproject.toml uv.lock

      - name: Preflight immutable package state
        env:
          GITEA_PACKAGE_TOKEN: ${{ secrets.PKG_TOKEN }}
        run: |
          set -euo pipefail
          REPO_NAME=netbox-proxbox
          PKG_NAME=netbox-proxbox
          RESUME_ARGS=()
          if [ "${RESUME_EXISTING}" = "true" ]; then
            RESUME_ARGS+=(--resume-existing --attempts 12 --delay-seconds 5)
          fi
          ARTIFACT_ACTION="$(python3 scripts/release_artifacts.py prepare-upload \
            --registry "${GITHUB_SERVER_URL}/api/v1/packages/" \
            --owner emersonfelipesp \
            --repository "${REPO_NAME}" \
            --package "${PKG_NAME}" \
            --version "${VERSION}" \
            --manifest release-manifest.json \
            "${RESUME_ARGS[@]}")"
          case "${ARTIFACT_ACTION}" in
            upload|reuse) ;;
            *) echo "ERROR: invalid artifact action '${ARTIFACT_ACTION}'"; exit 1 ;;
          esac
          printf 'ARTIFACT_ACTION=%s\n' "${ARTIFACT_ACTION}" >> "${GITHUB_ENV}"

      - name: Reserve and verify RC promotion
        if: env.IS_RC == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          REPO_NAME=netbox-proxbox
          # Only release candidates are promoted to GitHub at this stage.
          # Final tags stay private until production validation and the
          # dedicated final-tag promotion workflow have succeeded.
          command -v gh >/dev/null 2>&1 || {
            echo "ERROR: pre-provisioned gh is required for RC promotion"
            exit 1
          }
          SECRET_ROOT="${RUNNER_TEMP}/netbox-proxbox-rc-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "${SECRET_ROOT}"
          umask 077
          mkdir -m 0700 "${SECRET_ROOT}"
          trap 'rm -rf -- "${SECRET_ROOT}"' EXIT
          export GH_CONFIG_DIR="${SECRET_ROOT}/gh"
          mkdir -m 0700 "${GH_CONFIG_DIR}"
          cat > "${SECRET_ROOT}/askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 0500 "${SECRET_ROOT}/askpass"
          gh --version
          gh auth status --hostname github.com
          GH_REPO="emersonfelipesp/${REPO_NAME}"
          test "$(gh repo view "${GH_REPO}" --json nameWithOwner --jq .nameWithOwner)" = "${GH_REPO}"
          test "$(gh api "repos/${GH_REPO}" --jq '.permissions.push')" = "true" || {
            echo "ERROR: GitHub token lacks push permission for ${GH_REPO}"
            exit 1
          }
          RULESET_IDS="$(gh api \
            "repos/${GH_REPO}/rulesets?targets=tag&includes_parents=true&per_page=100" \
            --jq '.[].id')"
          test -n "${RULESET_IDS}" || {
            echo "ERROR: no GitHub tag ruleset protects release reservations"
            exit 1
          }
          mkdir -m 0700 "${SECRET_ROOT}/rulesets"
          while IFS= read -r RULESET_ID; do
            case "${RULESET_ID}" in
              ''|*[!0-9]*) echo "ERROR: invalid GitHub ruleset id"; exit 1 ;;
            esac
            gh api "repos/${GH_REPO}/rulesets/${RULESET_ID}?includes_parents=true" \
              > "${SECRET_ROOT}/rulesets/${RULESET_ID}.json"
          done <<< "${RULESET_IDS}"
          env -u GH_TOKEN python3 scripts/release_artifacts.py \
            validate-github-tag-rulesets \
            --rulesets "${SECRET_ROOT}/rulesets" \
            --repository "${GH_REPO}"
          git -C candidate remote add github "https://github.com/${GH_REPO}.git" \
            || git -C candidate remote set-url github "https://github.com/${GH_REPO}.git"
          test "$(git -C candidate remote get-url github)" = \
            "https://github.com/emersonfelipesp/netbox-proxbox.git"
          LOCAL_TAG_OBJECT="$(git -C candidate rev-parse refs/release-policy/candidate-tag)"
          REMOTE_TAG_LINE="$(GIT_ASKPASS="${SECRET_ROOT}/askpass" \
            GIT_TERMINAL_PROMPT=0 git -C candidate ls-remote github "refs/tags/${TAG}")"
          if [ -n "${REMOTE_TAG_LINE}" ]; then
            REMOTE_TAG_OBJECT="${REMOTE_TAG_LINE%%[[:space:]]*}"
            test "${REMOTE_TAG_OBJECT}" = "${LOCAL_TAG_OBJECT}" || {
              echo "ERROR: GitHub tag ${TAG} points to different bytes"
              exit 1
            }
            test "${RESUME_EXISTING}" = "true" || {
              echo "ERROR: GitHub tag ${TAG} already exists; use explicit resume mode"
              exit 1
            }
          else
            GIT_ASKPASS="${SECRET_ROOT}/askpass" GIT_TERMINAL_PROMPT=0 \
              git -C candidate push --dry-run github \
              "refs/release-policy/candidate-tag:refs/tags/${TAG}"
            GIT_ASKPASS="${SECRET_ROOT}/askpass" GIT_TERMINAL_PROMPT=0 \
              git -C candidate push github \
              "refs/release-policy/candidate-tag:refs/tags/${TAG}"
          fi
          VERIFIED_TAG_OBJECT="$(GIT_ASKPASS="${SECRET_ROOT}/askpass" \
            GIT_TERMINAL_PROMPT=0 git -C candidate ls-remote --exit-code github \
            "refs/tags/${TAG}" | awk '{print $1}')"
          test "${VERIFIED_TAG_OBJECT}" = "${LOCAL_TAG_OBJECT}"

      - name: Publish to Gitea Package Registry
        if: env.ARTIFACT_ACTION == 'upload'
        env:
          TWINE_USERNAME: emersonfelipesp
          TWINE_PASSWORD: ${{ secrets.PKG_TOKEN }}
          TWINE_REPOSITORY_URL: https://git.nmulti.cloud/api/packages/emersonfelipesp/pypi
        run: |
          set -euo pipefail
          # The pinned twine from the locked `publish` group synced above; the
          # previous `--with twine` resolved a separate ephemeral layer at run
          # time, and that layer ran with the registry credential.
          .venv/bin/python -m twine upload --non-interactive dist/*

      - name: Verify package in Gitea registry
        env:
          GITEA_PACKAGE_TOKEN: ${{ secrets.PKG_TOKEN }}
        run: |
          set -euo pipefail
          # Verified against the manifest rather than by counting search hits.
          # The previous check listed the owner's packages and counted entries
          # whose version matched, which any package of any name at that
          # version satisfies -- so it could pass while this package's own
          # upload was absent, incomplete, or carrying different bytes. Since
          # the very next step publishes the manifest as the provenance record
          # every deploy and promotion verifies against, that gate has to prove
          # the exact artifact set is present, with the exact sizes and digests
          # the manifest recorded.
          PKG_NAME=netbox-proxbox
          REPO_NAME=netbox-proxbox
          # The forge origin comes from the runner rather than being written
          # down here. release_artifacts still pins the permitted origin
          # itself, so a wrong value fails closed rather than reaching an
          # unexpected host.
          python3 scripts/release_artifacts.py verify-registry \
            --registry "${GITHUB_SERVER_URL}/api/v1/packages/" \
            --owner emersonfelipesp \
            --repository "${REPO_NAME}" \
            --package "${PKG_NAME}" \
            --version "${VERSION}" \
            --manifest release-manifest.json \
            --attempts 12 \
            --delay-seconds 5
          echo "Package ${PKG_NAME} ${VERSION} matches the release manifest in Gitea"

      - name: Publish release manifest
        env:
          GITEA_PACKAGE_TOKEN: ${{ secrets.PKG_TOKEN }}
        run: |
          set -euo pipefail
          # Published last, deliberately. The manifest asserts that this exact
          # artifact set exists for this version, so it must not appear for a
          # version whose wheel/sdist upload failed or was never verified --
          # `latest_package` treats the manifest's presence as the signal that
          # a version is deployable. The helper uploads the canonical bytes,
          # links the package to this repository (repository linkage is what
          # `fetch-gitea` checks; an unlinked package is rejected), and reads
          # the result back, failing if the stored bytes differ from what was
          # sent.
          #
          # An interrupted run resumes only after the preflight has rebuilt the
          # candidate and proved every existing wheel/sdist byte identical to
          # the local manifest. The manifest helper is itself idempotent only
          # for the same canonical bytes, so recovery cannot overwrite or
          # silently rebind an immutable release.
          REPO_NAME=netbox-proxbox
          python3 scripts/release_artifacts.py publish-manifest \
            --registry "${GITHUB_SERVER_URL}/api/v1/packages/" \
            --owner emersonfelipesp \
            --repository "${REPO_NAME}" \
            --manifest release-manifest.json
          echo "Release manifest published and verified for ${VERSION}"
