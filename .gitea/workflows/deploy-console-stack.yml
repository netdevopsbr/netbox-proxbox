name: Deploy the reviewed NMS console stack

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nms-console-stack-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the fixed console-compatible stack
    runs-on: prod-deploy
    timeout-minutes: 45
    env:
      BACKEND_COMMIT: 65d88cd805b3a74ab31724e9274a559366f78f3f
      NMS_MCP_COMMIT: 8d9cbdb750ecbd347911f6b002e86e5263708632
      NMS_COMMIT: 07c18a3a3e94bb2ccdd8dddd1f7a204fc7573f9d
      DEPLOY_APP_COMMAND: /opt/nmulticloud/deploy/bin/deploy-app
      STATUS_APP_COMMAND: /opt/nmulticloud/deploy/bin/status-app
    steps:
      - name: Validate the fixed production request
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = emersonfelipesp/netbox-proxbox
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = emersonfelipesp
          test "${GITHUB_RUN_ATTEMPT:-1}" = 1
          printf '%s\n' "$BACKEND_COMMIT" "$NMS_MCP_COMMIT" "$NMS_COMMIT" \
            | grep -Ex '[a-f0-9]{40}' \
            | test "$(wc -l)" -eq 3
          test -x "$DEPLOY_APP_COMMAND"
          test -x "$STATUS_APP_COMMAND"

      - name: Deploy the exact backend revision
        run: |
          set -euo pipefail
          "$DEPLOY_APP_COMMAND" nms-backend "$BACKEND_COMMIT"
          report="$($STATUS_APP_COMMAND nms-backend)"
          printf '%s\n' "$report"
          printf '%s\n' "$report" | grep -Fx "current=$BACKEND_COMMIT"

      - name: Deploy the exact MCP companion revision
        run: |
          set -euo pipefail
          "$DEPLOY_APP_COMMAND" nms-mcp "$NMS_MCP_COMMIT"
          report="$($STATUS_APP_COMMAND nms-mcp)"
          printf '%s\n' "$report"
          printf '%s\n' "$report" | grep -Fx "current=$NMS_MCP_COMMIT"

      - name: Deploy the exact NMS frontend revision
        run: |
          set -euo pipefail
          "$DEPLOY_APP_COMMAND" nms "$NMS_COMMIT"
          report="$($STATUS_APP_COMMAND nms)"
          printf '%s\n' "$report"
          printf '%s\n' "$report" | grep -Fx "current=$NMS_COMMIT"

      - name: Require the complete compatible stack
        run: |
          set -euo pipefail
          backend_report="$($STATUS_APP_COMMAND nms-backend)"
          mcp_report="$($STATUS_APP_COMMAND nms-mcp)"
          nms_report="$($STATUS_APP_COMMAND nms)"
          printf '%s\n' "$backend_report"
          printf '%s\n' "$mcp_report"
          printf '%s\n' "$nms_report"
          printf '%s\n' "$backend_report" | grep -Fx "current=$BACKEND_COMMIT"
          printf '%s\n' "$mcp_report" | grep -Fx "current=$NMS_MCP_COMMIT"
          printf '%s\n' "$nms_report" | grep -Fx "current=$NMS_COMMIT"
          curl --disable --fail --silent --show-error \
            --noproxy '*' --proto '=http' --max-redirs 0 --max-time 15 \
            http://127.0.0.1:16001/status/ping
          curl --disable --fail --silent --show-error \
            --noproxy '*' --proto '=http' --max-redirs 0 --max-time 15 \
            http://127.0.0.1:3001/ >/dev/null

      - name: Report the current stack after failure
        if: failure()
        run: |
          set -u
          "$STATUS_APP_COMMAND" nms-backend || true
          "$STATUS_APP_COMMAND" nms-mcp || true
          "$STATUS_APP_COMMAND" nms || true

      - name: Report the bounded backend candidate diagnostic after failure
        if: failure()
        run: |
          set -u
          image="nmc/nms-backend:$BACKEND_COMMIT"
          container="nms-backend-contract-diagnostic-${GITHUB_RUN_ID}"
          printf '%s' "$GITHUB_RUN_ID" | grep -Eq '^[1-9][0-9]*$' || exit 0
          docker image inspect "$image" >/dev/null 2>&1 || exit 0
          docker rm -f "$container" >/dev/null 2>&1 || true
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run --name="$container" --pull=never --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=256 \
            --memory=1g --cpus=1 --user=65534:65534 \
            --tmpfs=/tmp:rw,noexec,nosuid,nodev,size=64m \
            --env=PYTHONDONTWRITEBYTECODE=1 --env="NMS_BACKEND_COMMIT=$BACKEND_COMMIT" \
            --entrypoint=python "$image" -P -s -c \
            "import json; from automation.main import app; print(json.dumps(app.openapi(), ensure_ascii=False, separators=(',', ':')))" \
            || true
